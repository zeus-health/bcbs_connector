version: 2

sources:
  - name: bcbs
    description: >
      Raw BCBS data from source system.
      Note: payer, market, and lob columns contain incorrect metadata (DE-3263).
      These values are hard-coded in the intermediate layer until upstream config is fixed.
    database: zus_insights
    schema: insights_raw_claims_streaming
    tables:
      - name: commercial_hmo_member
        description: "Raw BCBS HMO member eligibility file"
        columns:
          - name: cursubid
            description: "Subscriber ID (part of composite member key)"
          - name: bcmbrnbr
            description: "Member number (part of composite member key)"
          - name: pcp_npi
            description: "PCP NPI for provider attribution"
          - name: payer
            description: "Payer identifier from source (WARNING: contains incorrect values per DE-3263; hard-coded downstream)"
          - name: market
            description: "Market segment (WARNING: contains incorrect values per DE-3263; hard-coded downstream)"
          - name: lob
            description: "Line of business (WARNING: contains incorrect values per DE-3263; hard-coded downstream)"
      - name: commercial_ppo_member
        description: "Raw BCBS PPO member eligibility file"
        columns:
          - name: cursubid
            description: "Subscriber ID (part of composite member key)"
          - name: bcmbrnbr
            description: "Member number (part of composite member key)"
          - name: pcp_npi
            description: "PCP NPI for provider attribution"
          - name: payer
            description: "Payer identifier from source (WARNING: contains incorrect values per DE-3263; hard-coded downstream)"
          - name: market
            description: "Market segment (WARNING: contains incorrect values per DE-3263; hard-coded downstream)"
          - name: lob
            description: "Line of business (WARNING: contains incorrect values per DE-3263; hard-coded downstream)"
      - name: bcbsm_edps_claim
      - name: bcbsm_med_claim
        description: "Raw BCBS medical claims file"
        columns:
          - name: int_clm_num
            description: "Internal claim number"
          - name: clm_line_num
            description: "Claim line number"
          - name: cursubid
            description: "Subscriber ID (part of composite member key)"
          - name: bcmbrnbr
            description: "Member number (part of composite member key)"
          - name: curr_clm_ind
            description: "Current claim indicator (Y=current, N=negative adjustment)"
          - name: charge_amt
            description: "Charge amount"
          - name: netpay
            description: "Net pay amount (total paid by insurer) → paid_amount"
          - name: paid
            description: "Paid/allowed amount (total allowed including insurer and patient) → allowed_amount"
          - name: coins_amt
            description: "Coinsurance amount"
          - name: copay_amt
            description: "Copayment amount"
          - name: deduct_amt
            description: "Deductible amount"
          - name: dw_mem_liab_amt
            description: "Member liability amount (component of total_cost_amount)"
          - name: cobamt
            description: "Coordination of benefits amount (component of total_cost_amount)"
          - name: payer
            description: "Payer identifier from source (WARNING: contains incorrect values per DE-3263; hard-coded downstream)"
          - name: market
            description: "Market segment (WARNING: contains incorrect values per DE-3263; hard-coded downstream)"
          - name: lob
            description: "Line of business (WARNING: contains incorrect values per DE-3263; hard-coded downstream)"
          - name: date_id
            description: "File/partition date"
          - name: s3_path
            description: "S3 file path"
          - name: _run_time
            description: "Run time timestamp of ingestion"
