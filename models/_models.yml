version: 2

models:
  # staging
  - name: stg_bcbs_member
    description: "Staging model for BCBS members, 1:1 with the member fields on the bcbsm_med_claim source"
    columns:
      - name: subscriber_id
        data_tests:
          - not_null:
              config:
                severity: warn
    config:
      tags: ["bcbs"]
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}      

  - name: stg_bcbs_medical_claims
    description: "Staging model for BCBS medical claims, 1:1 with the bcbsm_med_claim source"
    columns:
      - name: claim_id
        data_tests:
          - not_null:
              config:
                severity: warn
    config:
      tags: ["bcbs"]          
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}      

  - name: stg_bcbs_edps_medical_claims
    description: "Staging model for BCBS EDPS (encounter) medical claims, 1:1 with the bcbsm_edps_claim source"
    columns:
      - name: encounter_internal_control_number
        data_tests:
          - not_null
    config:
      tags: ["bcbs"]
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}

  - name: stg_bcbs_pharmacy_claims
    description: "Staging model for BCBS pharmacy claims"
    columns:
      - name: int_clm_num
        data_tests:
          - not_null
    config:
      tags: ["bcbs"]        
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}        

  # intermediate
  - name: int_bcbs_member_eligibility
    description: "Intermediate model for BCBS member eligibility with normalized fields and proper casts"
    columns:
      - name: person_id
        data_tests:
          - not_null
      - name: member_id
        data_tests:
          - not_null
    config:
      tags: ["bcbs"]          
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}      
      

  - name: int_bcbs_medical_claim_combined
    description: "Intermediate model mapping BCBS MED and EDPS staging claims onto a shared claim contract and unioning them"
    columns:
      - name: int_clm_num
        data_tests:
          - not_null
    config:
      tags: ["bcbs"]
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}

  - name: int_bcbs_medical_claims
    description: "Intermediate model for BCBS medical claims with dedup, classification, and Tuva column mapping"
    columns:
      - name: claim_id
        data_tests:
          - not_null
      - name: person_id
        data_tests:
          - not_null
    config:
      tags: ["bcbs"]      
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}          

  - name: int_bcbs_pharmacy_claims
    description: "Intermediate model for BCBS pharmacy claims with dedup and Tuva column mapping"
    columns:
      - name: claim_id
        data_tests:
          - not_null
      - name: person_id
        data_tests:
          - not_null
    config:
      tags: ["bcbs"] 
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}               

  # final
  - name: eligibility
    description: "Final eligibility model for BCBS"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - member_id
              - enrollment_start_date
              - payer
              - plan
              - data_source
    columns:
      - name: person_id
        data_tests:
          - not_null
      - name: member_id
        data_tests:
          - not_null
      - name: birth_date
        data_tests:
          - not_null
      - name: enrollment_status
        description: 'Enrollment status. Not available from BCBS; null placeholder for Tuva compatibility.'
      - name: hospice_flag
        description: 'Indicates whether the patient is enrolled in hospice (1 = yes, 0 = no, null = unknown). Required by Tuva CMS HCC mart.'
      - name: institutional_snp_flag
        description: 'Indicates whether the patient is enrolled in an institutional Special Needs Plan (1 = yes, 0 = no, null = unknown). Required by Tuva CMS HCC mart.'
      - name: long_term_institutional_flag
        description: 'Indicates whether the patient is in a long-term institutional setting (1 = yes, 0 = no, null = unknown). Required by Tuva CMS HCC mart.'
    config:
      tags: ["bcbs"]
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}      
      materialized: table

  - name: medical_claim
    description: "Final medical claim model for BCBS"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - claim_id
              - claim_line_number
              - data_source
    columns:
      - name: claim_id
        data_tests:
          - not_null
      - name: claim_line_number
        data_tests:
          - not_null
      - name: person_id
        data_tests:
          - not_null
    config:
      tags: ["bcbs"]          
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}      
      materialized: table

  - name: pharmacy_claim
    description: "Final pharmacy claim model for BCBS"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - claim_id
              - claim_line_number
              - data_source
    columns:
      - name: claim_id
        data_tests:
          - not_null
      - name: person_id
        data_tests:
          - not_null
    config:
      tags: ["bcbs"]
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}      
      materialized: table